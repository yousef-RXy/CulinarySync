<!DOCTYPE html><html lang=en><meta charset=UTF-8><meta name=viewport content="width=device-width, initial-scale=1.0"><meta http-equiv=X-UA-Compatible content="ie=edge"><link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,600,700" rel=stylesheet><link rel="icon shortcut" href=favicon.b66fe1d8.svg type=image/svg+xml><link rel=stylesheet href=final.bc34c85f.css><script type=module src=final.1375ed72.js></script><title>CulinarySync | Recipe Management</title><body>
    <div class=container>
      <header class=header>
        <img src=logo.a01a2a0c.svg alt=CulinarySync class=header__logo>
        <form class=search>
          <input class=search__field placeholder="Search over 1,000,000 recipes...">
          <button class="btn search__btn">
            <svg class=search__icon><use href=icons.9717e574.svg#icon-search /></svg>
            <span>Search</span>
          </button>
        </form>

        <nav class=nav>
          <ul class=nav__list>
            <li class=nav__item>
              <button class="nav__btn nav__btn--add-recipe">
                <svg class=nav__icon><use href=icons.9717e574.svg#icon-edit /></svg>
                <span>Add recipe</span>
              </button>
            </li>
            <li class=nav__item>
              <button class="nav__btn nav__btn--bookmarks">
                <svg class=nav__icon><use href=icons.9717e574.svg#icon-bookmark /></svg>
                <span>Bookmarks</span>
              </button>
              <div class=bookmarks>
                <ul class=bookmarks__list>
                  <div class=message>
                    <div>
                      <svg><use href=icons.9717e574.svg#icon-smile /></svg>
                    </div>
                    <p>
                      No bookmarks yet. Find a nice recipe and bookmark it :)
                    </p>
                  </div>

                  
                </ul>
              </div>
            </li>
          </ul>
        </nav>
      </header>

      <div class=search-results>
        <ul class=results>
          
        </ul>

        <div class=pagination>
          
        </div>

        <p class=copyright>
          © 2026 CulinarySync. Custom dashboard engineered for internal culinary management.
        </p>
      </div>

      <div class=recipe>
        <div class=message>
          <div>
            <svg><use href=icons.9717e574.svg#icon-smile /></svg>
          </div>
          <p>Start by searching for a recipe or an ingredient. Have fun!</p>
        </div>

        

        

        
      </div>
    </div>

    <div class="hidden overlay"></div>
    <div class="add-recipe-window hidden">
      <button class=btn--close-modal>×</button>
      <form class=upload>
        <div class=upload__column>
          <h3 class=upload__heading>Recipe data</h3>
          <label>Title</label>
          <input required name=title placeholder="e.g. Grilled Salmon">
          <label>URL</label>
          <input required name=sourceUrl placeholder="Recipe source URL">
          <label>Image URL</label>
          <input required name=image placeholder="Image URL">
          <label>Publisher</label>
          <input required name=publisher placeholder="Publisher name">
          <label>Prep time</label>
          <input required name=cookingTime type=number placeholder=Minutes>
          <label>Servings</label>
          <input required name=servings type=number placeholder="Number of servings">
        </div>

        <div class=upload__column>
          <h3 class=upload__heading>Ingredients</h3>
          <label>Ingredient 1</label>
          <input value=0.5,kg,Rice required name=ingredient-1 placeholder="Format: 'Quantity,Unit,Description'">
          <label>Ingredient 2</label>
          <input value=1,,Avocado name=ingredient-2 placeholder="Format: 'Quantity,Unit,Description'">
          <label>Ingredient 3</label>
          <input value=,,salt name=ingredient-3 placeholder="Format: 'Quantity,Unit,Description'">
          <label>Ingredient 4</label>
          <input name=ingredient-4 placeholder="Format: 'Quantity,Unit,Description'">
          <label>Ingredient 5</label>
          <input name=ingredient-5 placeholder="Format: 'Quantity,Unit,Description'">
          <label>Ingredient 6</label>
          <input name=ingredient-6 placeholder="Format: 'Quantity,Unit,Description'">
        </div>

        <button class="btn upload__btn">
          <svg><use href=icons.9717e574.svg#icon-upload-cloud /></svg>
          <span>Upload</span>
        </button>
      </form>
    </div>
